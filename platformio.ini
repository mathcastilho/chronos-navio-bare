; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; uncomment only one
; default_envs = elecrow_c3_128 ; ELECROW C3 LCD 1.28 240x240
; default_envs = m5_dial ; M5 Stack Dial 240x240
default_envs = viewe_smartring ; Viewe SmartRing 1.75 466x466 AMOLED
; default_envs = viewe_knob_15 ; Viewe Touch Knob 1.5 466x466 AMOLED
; default_envs = guition_c3_128 ; ESP32-C3 LVGL 1.28 Inch 240x240
; default_envs = lolin_s3_mini_1_28 ; Waveshare ESP32-S3-Touch-LCD-1.28
; default_envs = waveshare_s3_169 ; Waveshare ESP32-S3-Touch-LCD-1.69

; default_envs = elecrow_35 ; ELECROW 3.5 Inch 320x480 TFT
; default_envs = wt32_sc01_plus ; WT32-SC01-PLUS 3.5 Inch 320x480 TFT


[env]
lib_deps = 
	lvgl/lvgl@9.5.0
	file://./../../../LVGL-Editor/navio_ui
build_flags = 
    -I include
	-D LV_CONF_SKIP
    -D LV_CONF_INCLUDE_SIMPLE
	-D LV_LVGL_H_INCLUDE_SIMPLE=1
	-D LV_USE_OBJ_NAME=1
	-D LV_USE_STDLIB_MALLOC=LV_STDLIB_CLIB

	-D LV_USE_TRANSLATION=1
	-D LV_USE_TINY_TTF=1
	; -D LV_USE_XML=1
    -D LV_USE_OS=LV_OS_CUSTOM
    -D LV_OS_CUSTOM_INCLUDE=\"lv_os_custom.h\"

    -D LV_USE_LOG=1

	; -D LV_USE_SYSMON=1
	; -D LV_USE_PERF_MONITOR=1
	; -D LV_USE_PERF_MONITOR_POS=LV_ALIGN_TOP_MID


[esp32]
platform = espressif32@6.9.0
framework = arduino
extra_scripts = 
	pre:scripts/board_profile_deps.py
	pre:scripts/sync_ui.py
	scripts/build_firmware.py
lib_deps = 
	${env.lib_deps}
	lovyan03/LovyanGFX@1.1.16
    fbiego/ChronosESP32@1.9.0
    fbiego/Timber@2.0.0
build_flags = 
	${env.build_flags}

	

; ELECROW C3 LCD 1.28
[env:elecrow_c3_128]
extends = esp32
board = lolin_c3_mini
board_build.partitions = partitions/partition.csv
lib_deps = 
	${esp32.lib_deps}
	makuna/RTC@2.4.3
build_flags = 
	${esp32.build_flags}
	-D BOARD_PROFILE_INCLUDE=\"boards/elecrow_c3_128.hpp\"

; Viewe SmartRing 466x466 AMOLED 
[env:viewe_smartring]
extends = esp32
board = lolin_s3_pro
board_build.partitions = partitions/partition_16M.csv
lib_deps = 
	${esp32.lib_deps}
	moononournation/GFX Library for Arduino@1.5.7
	lewisxhe/SensorLib@0.3.1
	FastIMU=https://github.com/LiquidCGS/FastIMU/archive/refs/tags/1.2.6.zip
build_flags = 
	${esp32.build_flags}
	-D BOARD_PROFILE_INCLUDE=\"boards/viewe_smartring.hpp\"
	-DARDUINO_USB_CDC_ON_BOOT=1

