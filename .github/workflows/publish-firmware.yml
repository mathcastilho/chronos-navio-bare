name: Publish Firmware

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Build all firmware
        run: pio run

      - name: Publish firmware
        env:
          ESPVERSE_API_KEY: ${{ secrets.ESPVERSE_API_KEY }}
        run: python scripts/publish_firmware.py "$ESPVERSE_API_KEY"
